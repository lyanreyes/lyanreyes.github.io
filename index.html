<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LyanOS · Lyan Reyes Portfolio</title>
<meta name="description" content="Lyan Reyes, Computer Science student from Batangas, Philippines. An interactive desktop-style portfolio: open windows, try live project demos, use the terminal, and play a mini-game.">
<meta name="theme-color" content="#040a1a">
<meta property="og:title" content="LyanOS · Lyan Reyes Portfolio">
<meta property="og:description" content="An interactive desktop-style portfolio with live demos of my apps.">
<meta property="og:image" content="img/lyan.png">
<link rel="icon" href="img/lyan.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="os.css">
</head>
<body>
<div id="boot"><div class="b"><div class="logo">L</div><p>Starting LyanOS…</p><div class="bar"><i></i></div></div></div>

<canvas id="wall" aria-hidden="true"></canvas>
<div class="wall-mark"><h1>Lyan Reyes</h1><p>Computer Science Student · Batangas, PH</p></div>

<div id="widget">
  <img src="img/lyan.png" alt="">
  <div><b>Lyan Reyes</b><small>CS Student · Batangas, PH</small><div class="wclock" id="wclock"></div></div>
</div>

<main id="desktop" aria-label="Desktop"></main>

<button id="astro" aria-label="Talk to Rocky">
  <span class="astro-bubble">Hi, I'm Rocky! Click to chat 👋</span>
  <svg class="astro-svg" viewBox="0 0 140 170" aria-hidden="true">
    <defs>
      <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#7cc4ff" stop-opacity=".45"/><stop offset="1" stop-color="#7cc4ff" stop-opacity="0"/></radialGradient>
      <radialGradient id="stone" cx=".35" cy=".3" r=".85"><stop offset="0" stop-color="#c9bcaa"/><stop offset=".55" stop-color="#8d7f6e"/><stop offset="1" stop-color="#4a4038"/></radialGradient>
      <linearGradient id="limb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a39482"/><stop offset="1" stop-color="#5b4f44"/></linearGradient>
      <radialGradient id="eye" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#e9fbff"/><stop offset=".45" stop-color="#38d6ff"/><stop offset="1" stop-color="#1f5eff"/></radialGradient>
      <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9fbff"/><stop offset=".4" stop-color="#38d6ff"/><stop offset="1" stop-color="#1f5eff" stop-opacity="0"/></linearGradient>
      <linearGradient id="gem" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#bff0ff"/><stop offset="1" stop-color="#3a7bff"/></linearGradient>
      <filter id="rockTex" x="-10%" y="-10%" width="120%" height="120%">
        <feTurbulence type="fractalNoise" baseFrequency="0.09" numOctaves="4" seed="7" result="n"/>
        <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.25  0 0 0 0 0.2  0 0 0 0 0.16  0 0 0 1.4 -0.55" result="spots"/>
        <feComposite in="spots" in2="SourceAlpha" operator="in" result="spotsIn"/>
        <feTurbulence type="turbulence" baseFrequency="0.035 0.06" numOctaves="2" seed="3" result="t"/>
        <feDiffuseLighting in="t" surfaceScale="3.2" lighting-color="#fff" result="lit"><feDistantLight azimuth="225" elevation="48"/></feDiffuseLighting>
        <feComposite in="lit" in2="SourceAlpha" operator="in" result="litIn"/>
        <feBlend in="SourceGraphic" in2="litIn" mode="multiply" result="shaded"/>
        <feComposite in="spotsIn" in2="shaded" operator="over"/>
      </filter>
    </defs>
    <circle cx="70" cy="82" r="70" fill="url(#glow)"/>
    <!-- jet boosters -->
    <g class="flames"><path d="M29 122 q4 18 0 28 q-4 -10 0 -28Z" fill="url(#flame)"/><path d="M55 131 q4 22 0 34 q-4 -12 0 -34Z" fill="url(#flame)"/><path d="M87 131 q4 22 0 34 q-4 -12 0 -34Z" fill="url(#flame)"/><path d="M111 122 q4 18 0 28 q-4 -10 0 -28Z" fill="url(#flame)"/></g>
    <g filter="url(#rockTex)">
    <!-- four stubby feet: two in back (darker), two in front -->
    <path d="M30 104 l-8 12 q-2 5 3 6 h9 q5 0 5 -5 l1 -10Z" fill="#5b4f44"/>
    <path d="M106 104 l8 12 q2 5 -3 6 h-9 q-5 0 -5 -5 l-1 -10Z" fill="#5b4f44"/>
    <path d="M48 112 l-3 14 q0 5 6 5 h10 q5 0 4 -5 l-3 -14Z" fill="url(#limb)"/>
    <path d="M78 112 l-2 14 q0 5 6 5 h10 q5 0 4 -5 l-4 -14Z" fill="url(#limb)"/>
    <!-- left arm (resting) -->
    <path d="M30 78 q-12 10 -10 26 q1 6 7 5 q5 -1 5 -7 l2 -14Z" fill="url(#limb)"/>
    <!-- waving arm -->
    <g class="arm-wave"><path d="M104 74 q14 -10 18 -28 q1 -6 -5 -7 q-5 0 -6 5 q-3 12 -12 18Z" fill="url(#limb)"/><circle cx="117" cy="38" r="7" fill="#7a6c5d"/></g>
    <!-- boulder body -->
    <path d="M70 34 C92 33 108 44 110 66 C112 88 104 108 86 116 C72 122 56 121 44 114 C30 106 25 88 28 70 C31 49 47 35 70 34Z" fill="url(#stone)"/>
    <!-- cracks, speckles, moss -->
    <path d="M52 50 l8 8 l-3 9 M92 60 l-7 6 l4 10 M60 98 l9 -4 l6 6" stroke="#4a4038" stroke-width="1.6" fill="none" stroke-linecap="round" opacity=".7"/>
    <g fill="#4a4038" opacity=".45"><circle cx="40" cy="80" r="2"/><circle cx="98" cy="92" r="2.4"/><circle cx="78" cy="106" r="1.6"/><circle cx="46" cy="62" r="1.4"/><circle cx="96" cy="50" r="1.5"/></g>
    <path d="M36 92 q8 -6 16 0 q-8 4 -16 0Z" fill="#5fa86a" opacity=".55"/>
    </g>
    <!-- crystal crown -->
    <path d="M60 37 l4 -14 l5 13Z" fill="url(#gem)"/><path d="M69 35 l6 -18 l5 18Z" fill="url(#gem)"/><path d="M80 37 l5 -11 l3 12Z" fill="url(#gem)"/>
    <!-- face -->
    <ellipse cx="58" cy="70" rx="8" ry="9.5" fill="url(#eye)" class="eyes"/><ellipse cx="84" cy="70" rx="8" ry="9.5" fill="url(#eye)" class="eyes"/>
    <circle cx="55.5" cy="66.5" r="2.4" fill="#fff"/><circle cx="81.5" cy="66.5" r="2.4" fill="#fff"/>
    <path d="M62 86 q9 7 18 0" stroke="#3a312a" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <ellipse cx="50" cy="82" rx="5" ry="3" fill="#ff8f8f" opacity=".35"/><ellipse cx="92" cy="82" rx="5" ry="3" fill="#ff8f8f" opacity=".35"/>
    <!-- space bubble helmet -->
    <circle cx="70" cy="72" r="54" fill="rgba(160,210,255,.07)" stroke="rgba(200,230,255,.55)" stroke-width="2"/>
    <path d="M36 50 q10 -22 34 -26" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" opacity=".55"/>
  </svg>
</button>
<div id="windows"></div>

<nav id="startmenu" aria-label="Start menu"></nav>

<footer id="taskbar">
  <button class="start" id="startbtn" aria-label="Start menu" aria-expanded="false"><span class="logo">L</span><span class="lbl">LyanOS</span></button>
  <div id="tasks" role="list"></div>
  <div class="tray">
    <a href="https://github.com/lyanreyes" target="_blank" rel="noopener" title="GitHub" aria-label="GitHub"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5a11.5 11.5 0 0 0-3.64 22.41c.58.1.79-.25.79-.56v-2c-3.2.7-3.88-1.37-3.88-1.37-.53-1.33-1.28-1.69-1.28-1.69-1.05-.71.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.71 1.26 3.37.96.1-.75.4-1.26.73-1.55-2.56-.29-5.25-1.28-5.25-5.69 0-1.26.45-2.29 1.19-3.1-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.17 1.18a11 11 0 0 1 5.77 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.84 1.19 3.1 0 4.42-2.7 5.4-5.27 5.68.41.36.78 1.06.78 2.14v3.17c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .5Z"/></svg></a>
    <button id="simplebtn" title="Simple view" aria-label="Simple view"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 13h8M8 16h5"/></svg></button>
  </div>
  <div id="clock" aria-live="off"></div>
</footer>

<noscript><p style="position:fixed;inset:auto 0 70px;text-align:center;color:#fff">This portfolio needs JavaScript. <a href="classic.html">Open the simple version</a>.</p></noscript>

</body>
</html>
